
name: Build macOS

on:
  push:
    branches:
      - main

jobs:
  build-arm64:
    name: Build Apple Silicon
    runs-on: macos-14

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install dependencies
        run: brew install sfml taglib

      - name: Build ARM64
        working-directory: src
        run: |
          set -euo pipefail

          brew_prefix="$(brew --prefix)"
          echo "Homebrew prefix: $brew_prefix"
          uname -m

          make clean
          make -f Makefile.macos \
            ARCH=arm64 \
            BREW_PREFIX="$brew_prefix"

          mkdir -p ../artifacts
          cp builds/mishplayer-arm64 ../artifacts/mishplayer-arm64

      - name: Upload ARM64 binary
        uses: actions/upload-artifact@v4
        with:
          name: mishplayer-arm64
          path: artifacts/mishplayer-arm64
          if-no-files-found: error

  package-app:
    name: Package Apple Silicon App
    needs: build-arm64
    runs-on: macos-14

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Download ARM64 binary
        uses: actions/download-artifact@v4
        with:
          name: mishplayer-arm64
          path: slices/arm64

      - name: Install packaging dependencies
        run: brew install sfml taglib

      - name: Prepare app bundle
        run: |
          set -euo pipefail

          mkdir -p src/builds
          cp slices/arm64/mishplayer-arm64 src/builds/mishplayer
          chmod +x src/builds/mishplayer

      - name: Stage dynamic libraries
        run: |
          set -euo pipefail
          mkdir -p bundled-libs

          BREW_PREFIX="$(brew --prefix)"

          for pattern in \
            "libsfml-*.dylib" \
            "libtag*.dylib" \
            "libvorbis*.dylib" \
            "libogg*.dylib" \
            "libflac*.dylib" \
            "libopus*.dylib"
          do
            for lib in "$BREW_PREFIX"/lib/$pattern; do
              [ -e "$lib" ] || continue
              cp -L "$lib" bundled-libs/
            done
          done

          if ! compgen -G "bundled-libs/*.dylib" > /dev/null; then
            echo "ERROR: No dynamic libraries were staged."
            exit 1
          fi

      - name: Create App Bundle
        run: |
          set -euo pipefail

          APP="release/MishPlayer.app"

          mkdir -p "$APP/Contents/MacOS"
          mkdir -p "$APP/Contents/Frameworks"
          mkdir -p "$APP/Contents/Resources"

          cp src/builds/mishplayer "$APP/Contents/MacOS/mishplayer"
          cp bundled-libs/*.dylib "$APP/Contents/Frameworks/"
          chmod +x "$APP/Contents/MacOS/mishplayer"

          if [ -d assets ]; then
            cp -R assets/. "$APP/Contents/Resources/"
          fi

          cat > "$APP/Contents/Info.plist" <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleName</key>
              <string>Mish Player</string>
              <key>CFBundleDisplayName</key>
              <string>Mish Player</string>
              <key>CFBundleIdentifier</key>
              <string>com.mish.player</string>
              <key>CFBundleExecutable</key>
              <string>mishplayer</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>LSMinimumSystemVersion</key>
              <string>11.0</string>
          </dict>
          </plist>
          EOF

      - name: Fix dynamic library paths
        run: |
          set -euo pipefail

          APP="release/MishPlayer.app"
          EXECUTABLE="$APP/Contents/MacOS/mishplayer"
          FRAMEWORKS="$APP/Contents/Frameworks"

          install_name_tool \
            -add_rpath "@executable_path/../Frameworks" \
            "$EXECUTABLE" || true

          for lib in "$FRAMEWORKS"/*.dylib; do
            [ -f "$lib" ] || continue

            LIBNAME="$(basename "$lib")"
            install_name_tool -id "@rpath/$LIBNAME" "$lib"

            while IFS= read -r old_path; do
              [ -n "$old_path" ] || continue

              LIBNAME="$(basename "$old_path")"

              if [ -f "$FRAMEWORKS/$LIBNAME" ]; then
                install_name_tool -change \
                  "$old_path" "@rpath/$LIBNAME" "$lib"
              fi
            done < <(
              otool -L "$lib" |
              awk 'NR > 1 {print $1}' |
              grep -E '^(/opt/homebrew|/usr/local)/' || true
            )
          done

          while IFS= read -r old_path; do
            [ -n "$old_path" ] || continue

            LIBNAME="$(basename "$old_path")"

            if [ -f "$FRAMEWORKS/$LIBNAME" ]; then
              install_name_tool -change \
                "$old_path" "@rpath/$LIBNAME" "$EXECUTABLE"
            fi
          done < <(
            otool -L "$EXECUTABLE" |
            awk 'NR > 1 {print $1}' |
            grep -E '^(/opt/homebrew|/usr/local)/' || true
          )

      - name: Verify app bundle
        run: |
          set -euo pipefail

          APP="release/MishPlayer.app"
          EXECUTABLE="$APP/Contents/MacOS/mishplayer"

          plutil -lint "$APP/Contents/Info.plist"
          test -x "$EXECUTABLE"

          file "$EXECUTABLE"
          lipo "$EXECUTABLE" -verify_arch arm64
          otool -L "$EXECUTABLE"

          echo "App bundle verified. No automatic launch or playback test."

      - name: Archive app bundle
        run: |
          set -euo pipefail

          ditto -c -k --sequesterRsrc --keepParent \
            release/MishPlayer.app \
            release/MishPlayer-macOS-Apple-Silicon.zip

      - name: Upload Apple Silicon app
        uses: actions/upload-artifact@v4
        with:
          name: MishPlayer-macOS-Apple-Silicon
          path: release/MishPlayer-macOS-Apple-Silicon.zip
          if-no-files-found: error
