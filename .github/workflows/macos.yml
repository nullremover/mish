
name: Build macOS

on:
  push:
    branches:
      - main

jobs:
  build:
    name: Build ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Apple Silicon
            runner: macos-14
            arch: arm64
            binary: mishplayer-arm64
            artifact: MishPlayer-macOS-Apple-Silicon

          - label: Intel
            runner: macos-15-intel
            arch: x86_64
            binary: mishplayer-x86_64
            artifact: MishPlayer-macOS-Intel

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install dependencies
        run: brew install sfml taglib

      - name: Build Mish
        working-directory: src
        run: |
          set -euo pipefail

          brew_prefix="$(brew --prefix)"
          echo "Homebrew prefix: $brew_prefix"
          uname -m

          make clean
          make -f Makefile.macos \
            ARCH=${{ matrix.arch }} \
            BREW_PREFIX="$brew_prefix"

          mkdir -p ../artifacts
          cp "builds/${{ matrix.binary }}" \
            "../artifacts/${{ matrix.binary }}"

      - name: Stage executable
        run: |
          set -euo pipefail

          APP="release/MishPlayer.app"
          mkdir -p "$APP/Contents/MacOS"
          mkdir -p "$APP/Contents/Frameworks"
          mkdir -p "$APP/Contents/Resources"

          cp "artifacts/${{ matrix.binary }}" \
            "$APP/Contents/MacOS/mishplayer"

          chmod +x "$APP/Contents/MacOS/mishplayer"

      - name: Bundle dynamic libraries
        run: |
          set -euo pipefail

          APP="release/MishPlayer.app"
          FRAMEWORKS="$APP/Contents/Frameworks"
          BREW_PREFIX="$(brew --prefix)"

          for pattern in \
            "libsfml-*.dylib" \
            "libtag*.dylib" \
            "libvorbis*.dylib" \
            "libogg*.dylib" \
            "libflac*.dylib" \
            "libopus*.dylib"
          do
            for lib in "$BREW_PREFIX"/lib/$pattern; do
              [ -e "$lib" ] || continue
              cp -L "$lib" "$FRAMEWORKS/"
            done
          done

          if ! compgen -G "$FRAMEWORKS/*.dylib" > /dev/null; then
            echo "ERROR: No dynamic libraries were bundled."
            exit 1
          fi

          if [ -d assets ]; then
            cp -R assets/. "$APP/Contents/Resources/"
          fi

      - name: Create Info.plist
        run: |
          set -euo pipefail

          cat > release/MishPlayer.app/Contents/Info.plist <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleName</key>
              <string>Mish Player</string>
              <key>CFBundleDisplayName</key>
              <string>Mish Player</string>
              <key>CFBundleIdentifier</key>
              <string>com.mish.player</string>
              <key>CFBundleExecutable</key>
              <string>mishplayer</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>LSMinimumSystemVersion</key>
              <string>12.0</string>
          </dict>
          </plist>
          EOF

      - name: Fix dynamic library paths
        run: |
          set -euo pipefail

          APP="release/MishPlayer.app"
          EXECUTABLE="$APP/Contents/MacOS/mishplayer"
          FRAMEWORKS="$APP/Contents/Frameworks"

          install_name_tool \
            -add_rpath "@executable_path/../Frameworks" \
            "$EXECUTABLE" || true

          for lib in "$FRAMEWORKS"/*.dylib; do
            [ -f "$lib" ] || continue

            LIBNAME="$(basename "$lib")"
            install_name_tool -id "@rpath/$LIBNAME" "$lib"

            while IFS= read -r old_path; do
              [ -n "$old_path" ] || continue

              DEP="$(basename "$old_path")"

              if [ -f "$FRAMEWORKS/$DEP" ]; then
                install_name_tool -change \
                  "$old_path" "@rpath/$DEP" "$lib"
              fi
            done < <(
              otool -L "$lib" |
              awk 'NR > 1 {print $1}' |
              grep -E '^(/opt/homebrew|/usr/local)/' || true
            )
          done

          while IFS= read -r old_path; do
            [ -n "$old_path" ] || continue

            DEP="$(basename "$old_path")"

            if [ -f "$FRAMEWORKS/$DEP" ]; then
              install_name_tool -change \
                "$old_path" "@rpath/$DEP" "$EXECUTABLE"
            fi
          done < <(
            otool -L "$EXECUTABLE" |
            awk 'NR > 1 {print $1}' |
            grep -E '^(/opt/homebrew|/usr/local)/' || true
          )

      - name: Verify architecture and package
        run: |
          set -euo pipefail

          APP="release/MishPlayer.app"
          EXECUTABLE="$APP/Contents/MacOS/mishplayer"

          plutil -lint "$APP/Contents/Info.plist"
          test -x "$EXECUTABLE"

          file "$EXECUTABLE"
          lipo "$EXECUTABLE" -verify_arch "${{ matrix.arch }}"
          otool -L "$EXECUTABLE"

          ditto -c -k --sequesterRsrc --keepParent \
            "$APP" \
            "release/${{ matrix.artifact }}.zip"

          echo "Package created. Mish was not launched."

      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: release/${{ matrix.artifact }}.zip
          if-no-files-found: error
